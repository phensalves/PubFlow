name: CI - ETL (Airflow)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          cd etl
          pip install -r requirements.txt

      - name: Validate Airflow DAGs
        run: |
          cd etl
          python -m unittest discover -s dags
