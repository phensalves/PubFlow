name: CI - External API

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  external-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          cd external-sales-api
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd external-sales-api
          python -m unittest discover
